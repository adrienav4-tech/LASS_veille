name: LASS Daily Automation

on:
  schedule:
    - cron: '0 6 * * *' # Tous les jours à 06:00 UTC
  workflow_dispatch: # Permet de lancer l'action manuellement depuis GitHub

jobs:
  update-veille:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraping Script
        run: python scripts/build_veille.py

      - name: Commit and Push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lass_papers.json README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Update LASS papers database"
          git push