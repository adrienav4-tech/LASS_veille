<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LASS - Radar Technologique</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --muted: #94a3b8; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 2rem; line-height: 1.5; }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { color: var(--accent); font-size: 2.5rem; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--muted); font-size: 1.1rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; display: flex; flex-direction: column; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; font-size: 0.875rem; }
        .date { background: #0c4a6e; color: #7dd3fc; padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: 600; }
        
        .title { font-size: 1.25rem; font-weight: 700; color: white; margin: 0 0 1rem 0; }
        .authors { color: var(--accent); font-size: 0.9rem; margin-bottom: 1rem; }
        .summary { color: var(--muted); font-size: 0.95rem; flex-grow: 1; margin-bottom: 1.5rem; }
        
        .btn { display: inline-block; background: var(--accent); color: #0369a1; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold; text-align: center; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <header>
        <h1>Radar LASS</h1>
        <p class="subtitle">Veille automatisée sur la séparation de sources audio (Language-Augmented)</p>
    </header>

    <div class="grid" id="papers-grid">
        </div>

    <script>
        async function fetchPapers() {
            try {
                // Le navigateur charge le JSON généré par l'action GitHub
                const response = await fetch('data/lass_papers.json');
                const papers = await response.json();
                const grid = document.getElementById('papers-grid');
                
                papers.forEach(paper => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-header">
                            <span class="date">📅 ${paper.date}</span>
                        </div>
                        <h2 class="title">${paper.title}</h2>
                        <div class="authors">👥 ${paper.authors.slice(0, 3).join(', ')} ${paper.authors.length > 3 ? 'et al.' : ''}</div>
                        <div class="summary">${paper.summary}</div>
                        <a href="${paper.url}" target="_blank" class="btn">Lire le papier sur arXiv ↗</a>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Erreur de chargement des données", error);
                document.getElementById('papers-grid').innerHTML = '<p>Impossible de charger les données de veille.</p>';
            }
        }

        fetchPapers();
    </script>

</body>
</html>
